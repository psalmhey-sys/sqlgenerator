!DOCTYPE html>
<html>
<head>
<title>Student_DB - Web Entry System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h2>Student_DB - Web Data Entry </h2>
<p>This website lets you input data and generates MySQL code for Workbench.</p>

<label>Student ID</label>
<input type="number" id="sid" placeholder="e.g. 111">
<label>Student Name</label>
<input type="text" id="sname" placeholder="e.g. Kevin Otieno">
<label>Department</label>
<select id="dept">
<option>Computer Science</option>
<option>Information Technology</option>
<option>Software Engineering</option>
<option>Business Administration</option>
</select>
<label>Year of Study</label>
<select id="year">
<option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
</select>
<label>GPA</label>
<input type="number" step="0.01" id="gpa" placeholder="e.g. 3.50">

<button onclick="addStudent()">Add Student to Website Table</button>

<table id="table">
<tr><th>ID</th><th>Name</th><th>Department</th><th>Year</th><th>GPA</th></tr>
</table>

<h3>SQL to copy into MySQL Workbench:</h3>
<div id="sqlBox">USE Student_DB;
-- Your INSERT statements will appear here --</div>

<button onclick="copySQL()" style="background:#2e7d32;margin-top:10px">Copy All SQL</button>
</div>

<script src="index.js"></script>
</body>
</html>
